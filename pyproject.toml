# Defines the package, dependencies, and build settings.
[project]
name = "conformal-selective-prediction"
version = "0.1.0"
description = "Conformal prediction sets for reliable multiclass automation and abstention."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.6",
]

[project.optional-dependencies]
dev = [
    "mypy<2",
    "pytest",
    "ruff",
]
example = [
    "matplotlib==3.11.1",
    "scikit-learn==1.9.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["src/conformal_selective_prediction", "examples", "tests"]
disallow_untyped_defs = true
disable_error_code = ["import-untyped"]
explicit_package_bases = true
