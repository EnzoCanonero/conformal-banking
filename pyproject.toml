# Defines the package, dependencies, and build settings.
[project]
name = "llm-scorekit"
version = "0.1.0"
description = "Conformal prediction sets for reliable multiclass automation and abstention."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Enzo Canonero"}]
keywords = ["conformal-prediction", "selective-classification", "llm"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0.2,<3",
]

[project.urls]
Source = "https://github.com/EnzoCanonero/llm-scorekit"
Documentation = "https://github.com/EnzoCanonero/llm-scorekit/blob/main/docs/usage.md"
Issues = "https://github.com/EnzoCanonero/llm-scorekit/issues"

[project.optional-dependencies]
dev = [
    "mypy<2",
    "pytest",
    "ruff",
]
example = [
    "matplotlib==3.11.1",
    "scikit-learn==1.9.0",
]
encoder = [
    "sentence-transformers==6.1.0",
]
llm = [
    "mlx==0.32.2",
    "mlx-lm==0.31.3",
]
notebook = [
    "ipykernel==7.3.0",
]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_scorekit", "llm_scorekit.*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/llm_scorekit", "examples", "tests"]
disallow_untyped_defs = true
disable_error_code = ["import-untyped"]
explicit_package_bases = true
